<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tile" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#075037"/>
      <stop offset="1" stop-color="#03231a"/>
    </linearGradient>
    <linearGradient id="ink" x1="32" y1="16" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ff0cd"/>
      <stop offset="1" stop-color="#21d3a4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#tile)"/>
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="14.25"
        fill="none" stroke="#21d3a4" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- N monogram (mint, glowing) -->
  <g filter="url(#glow)" fill="url(#ink)">
    <rect x="18" y="17" width="8" height="30" rx="2"/>
    <rect x="38" y="17" width="8" height="30" rx="2"/>
    <path d="M18 17 L26 17 L46 47 L38 47 Z"/>
  </g>

  <!-- AI node on the N's right terminal -->
  <circle cx="42" cy="17.5" r="8" fill="#21d3a4" fill-opacity="0.28"/>
  <circle cx="42" cy="17.5" r="4.4" fill="#7df7d6"/>
  <circle cx="42" cy="17.5" r="1.6" fill="#03231a"/>
</svg>
